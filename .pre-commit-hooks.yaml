- id: slopcheck
  name: slopcheck (hallucinated dependency check)
  description: Flags requirements.txt/pyproject.toml/package.json/Pipfile/setup.cfg entries that don't resolve to a real, established package.
  entry: slopcheck
  language: python
  files: (^|/)(requirements.*\.txt|pyproject\.toml|package\.json|Pipfile|setup\.cfg)$
  pass_filenames: true
