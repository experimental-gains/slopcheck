[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopcheck"
version = "0.1.15"
description = "Catch hallucinated (slopsquatted) dependencies before you install them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "experimental-gains" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = ["tomli; python_version < \"3.11\""]

[project.urls]
Homepage = "https://github.com/experimental-gains/slopcheck"

[project.scripts]
slopcheck = "slopcheck.cli:main"

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "packaging"]

[tool.setuptools.packages.find]
include = ["slopcheck*"]
